server:
  port: ${SERVER_PORT:8080}
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/christmas_wishlist}
    username: ${SPRING_DATASOURCE_USERNAME:christmas}
    password: ${SPRING_DATASOURCE_PASSWORD:christmas}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
logging:
  level:
    com.christmaswishlist: INFO
