services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: christmas_wishlist
      POSTGRES_USER: christmas
      POSTGRES_PASSWORD: christmas
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U christmas -d christmas_wishlist"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/christmas_wishlist
      SPRING_DATASOURCE_USERNAME: christmas
      SPRING_DATASOURCE_PASSWORD: christmas
      APP_CORS_ALLOWED_ORIGINS: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080/api
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
